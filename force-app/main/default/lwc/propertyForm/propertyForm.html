<template>
    <lightning-card title="Create Property" icon-name="standard:home">
        <div class="slds-p-around_medium">
            <div class="slds-grid slds-wrap slds-gutters">
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                    <lightning-input label="Address" name="address" value={address} onchange={handleChange} required></lightning-input>
                    <lightning-input label="City" name="city" value={city} onchange={handleChange} required></lightning-input>
                    <lightning-input label="State" name="state" value={state} onchange={handleChange} required></lightning-input>
                    <lightning-input label="Postal Code" name="postalCode" value={postalCode} onchange={handleChange} required></lightning-input>
                    <lightning-input label="Country" name="country" value={country} onchange={handleChange} required></lightning-input>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                    <lightning-combobox label="Property Type" name="propertyType" value={propertyType} options={propertyTypeOptions} onchange={handleChange} required></lightning-combobox>
                    <lightning-combobox label="Furnishing Status" name="furnishingStatus" value={furnishingStatus} options={furnishingOptions} onchange={handleChange}></lightning-combobox>
                    <lightning-combobox label="Availability" name="propertyStatus" value={propertyStatus} options={statusOptions} onchange={handleChange} required></lightning-combobox>
                    <lightning-input type="number" label="Monthly Rent" name="rent" value={rent} onchange={handleChange} min="0.01" step="0.01" required></lightning-input>
                </div>
            </div>

            <lightning-textarea label="Description" name="description" value={description} onchange={handleChange} required></lightning-textarea>

            <div class="slds-m-top_medium">
                <lightning-file-upload
                    label="Upload Property Images (required)"
                    name="propertyImages"
                    accept=".jpg,.jpeg,.png,.webp"
                    multiple
                    onuploadfinished={handleUploadFinished}>
                </lightning-file-upload>
                <p class="slds-m-top_x-small">Uploaded images: {documentIds.length}</p>
            </div>

            <div class="slds-m-top_large">
                <lightning-button label="Create Property" variant="brand" onclick={handleSave} disabled={saving}></lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
